name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest -v tests/test_toolkit.py
      - run: python -m toolkit assess --answers examples/answers_overconfident.json --inventory examples/sample_inventory.json --out out
