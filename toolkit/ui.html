<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Cloud Governance Maturity Toolkit</title>
<style>:root{color-scheme:light dark}body{font:14px system-ui;margin:0}header{padding:.8rem 1rem;border-bottom:1px solid #8884}main{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - 56px)}
aside{overflow:auto;padding:.8rem 1rem;border-right:1px solid #8884}iframe{width:100%;height:100%;border:0}h4{margin:.8rem 0 .2rem}label{display:block;margin:.3rem 0;font-size:12.5px}select,button,input{font:inherit;padding:3px 6px}
.btn{margin:.2rem .2rem .2rem 0}@media(max-width:900px){main{grid-template-columns:1fr;height:auto}iframe{height:90vh}}</style>
<header><b>☁ Cloud Governance Maturity Toolkit</b> &nbsp; <span style="opacity:.7">answers + live inventory evidence → board report</span></header>
<main><aside>
<div>Presets: <button class=btn onclick="preset('overconfident')">Overconfident exec</button><button class=btn onclick="preset('honest_partial')">Honest partial</button></div>
<div>Inventory JSON: <input type=file id=f accept=.json> <span id=src>(using sample estate)</span></div>
<div id=qs></div><button onclick=run() style="margin-top:1rem;padding:8px 16px;font-weight:700">▶ Run assessment</button></aside>
<iframe id=out srcdoc="<body style='font:14px system-ui;padding:2rem'>Pick a preset, then press <b>Run assessment</b>."></iframe></main>
<script>
let Q=[],INV=null;const $=i=>document.getElementById(i);
(async()=>{Q=await(await fetch('/api/questions')).json();let d='';
for(const q of Q){if(q.domain!==d){d=q.domain;$('qs').insertAdjacentHTML('beforeend',`<h4>${d}</h4>`)}
 $('qs').insertAdjacentHTML('beforeend',`<label><b>${q.id}</b> ${q.q} ${q.check?'<i title="measured from inventory">📡</i>':''}<br><select id="a_${q.id}"><option>no<option>partial<option>yes</select></label>`)}})();
async function preset(n){const a=await(await fetch('/api/preset/'+n)).json();for(const q of Q)$('a_'+q.id).value=a[q.id]||'no';run()}
$('f').onchange=e=>{const r=new FileReader();r.onload=()=>{INV=JSON.parse(r.result);$('src').textContent='(using '+e.target.files[0].name+')'};r.readAsText(e.target.files[0])};
async function run(){const answers={};for(const q of Q)answers[q.id]=$('a_'+q.id).value;
 const r=await fetch('/api/assess',{method:'POST',body:JSON.stringify({answers,inventory:INV})});const j=await r.json();
 $('out').srcdoc=r.ok?j.html:'<pre>'+j.error+'</pre>'}
</script>
